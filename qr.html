<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="贝尔智机通二维码部署页，供教师、实验员或项目维护人员复制设备链接并生成二维码。" />
  <title>二维码部署页 - 贝尔智机通</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            tech: {
              blue: '#38bdf8',
              cyan: '#22d3ee',
              orange: '#f59e0b',
              red: '#ef4444'
            }
          },
          boxShadow: {
            glow: '0 0 36px rgba(56, 189, 248, 0.18)'
          }
        }
      }
    };
  </script>
  <style>
    html,
    body {
      max-width: 100%;
      overflow-x: hidden;
    }

    .tech-bg {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 16%, rgba(34, 211, 238, 0.14), transparent 28%),
        radial-gradient(circle at 82% 18%, rgba(59, 130, 246, 0.12), transparent 30%),
        linear-gradient(180deg, #06111f 0%, #071827 48%, #020617 100%);
    }

    .tech-bg::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(148, 163, 184, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148, 163, 184, 0.08) 1px, transparent 1px),
        linear-gradient(rgba(34, 211, 238, 0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34, 211, 238, 0.1) 1px, transparent 1px);
      background-size: 32px 32px, 32px 32px, 160px 160px, 160px 160px;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0.25));
    }

    .tech-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(115deg, transparent 0 38%, rgba(34, 211, 238, 0.08) 46%, transparent 56% 100%),
        radial-gradient(circle at 70% 42%, rgba(14, 165, 233, 0.14), transparent 18%);
      animation: lightBreath 8s ease-in-out infinite;
      will-change: opacity;
    }

    .tech-grid {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, transparent 0 9%, rgba(34, 211, 238, 0.12) 9.2%, transparent 9.5% 100%),
        linear-gradient(180deg, transparent 0 28%, rgba(34, 211, 238, 0.1) 28.2%, transparent 28.5% 100%);
      opacity: 0.45;
    }

    .scan-line {
      display: block;
      position: absolute;
      left: 0;
      top: 0;
      height: 1px;
      width: 100%;
      background: linear-gradient(90deg, transparent, rgba(103, 232, 249, 0.5), transparent);
      opacity: 0.55;
      animation: softScan 7s linear infinite;
      will-change: transform, opacity;
    }

    .particle {
      display: none;
    }

    .device-model-thumb {
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 35%, rgba(34, 211, 238, 0.16), transparent 46%),
        linear-gradient(135deg, rgba(8, 47, 73, 0.74), rgba(2, 6, 23, 0.92));
    }

    @keyframes lightBreath {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 0.78; }
    }

    @keyframes softScan {
      0% { transform: translateY(-12vh); opacity: 0; }
      12%, 82% { opacity: 0.55; }
      100% { transform: translateY(108vh); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .tech-bg::after,
      .scan-line {
        animation: none;
      }
    }

    @media (max-width: 640px) {
      .tech-bg::after,
      .tech-grid {
        display: none;
      }

      .scan-line {
        animation-duration: 10s;
        opacity: 0.35;
      }
    }
  </style>
</head>
<body class="min-h-screen overflow-x-hidden bg-slate-950 text-slate-100 antialiased">
  <main class="relative min-h-screen overflow-hidden">
    <div class="tech-bg">
      <div class="tech-grid"></div>
      <div class="scan-line"></div>
      <span class="particle"></span>
      <span class="particle"></span>
      <span class="particle"></span>
      <span class="particle"></span>
    </div>

    <section class="relative mx-auto w-full max-w-6xl px-4 py-6 sm:px-8 lg:px-10">
      <header class="flex flex-wrap items-center justify-between gap-3">
        <div class="inline-flex min-h-10 items-center gap-3 text-sm font-semibold text-cyan-100">
          <img src="assets/jst-logo.svg" alt="贝尔智机通" class="h-14 w-auto max-w-[14rem] drop-shadow-[0_0_16px_rgba(34,211,238,0.18)]" />
          <span class="hidden sm:inline">教师/实验员专用入口</span>
        </div>
        <span class="hidden rounded-full border border-cyan-300/30 bg-cyan-300/10 px-3 py-1 text-xs font-semibold text-cyan-100 sm:inline-flex">二维码部署页</span>
      </header>

      <section class="mt-10 rounded-3xl border border-slate-700 bg-slate-900/75 p-4 sm:p-6">
        <div class="flex flex-wrap items-start justify-between gap-3">
          <div class="min-w-0">
            <p class="text-sm font-semibold text-cyan-200">设备链接列表</p>
            <h2 class="mt-2 break-words text-2xl font-black text-white">二维码部署</h2>
          </div>
          <div class="flex w-full flex-col gap-3 sm:w-auto sm:flex-row sm:flex-wrap">
            <a href="teacher-device.html?mode=new" class="inline-flex min-h-11 w-full items-center justify-center rounded-xl bg-cyan-300 px-4 py-2 text-sm font-black text-slate-950 transition hover:bg-cyan-200 sm:w-auto">新增设备</a>
            <button id="exportDevicesBtn" type="button" class="inline-flex min-h-11 w-full items-center justify-center rounded-xl border border-emerald-300/35 bg-emerald-300/10 px-4 py-2 text-sm font-bold text-emerald-100 transition hover:border-emerald-200 sm:w-auto">导出线上同步文件</button>
          </div>
        </div>
        <p id="pageMessage" class="mt-4 hidden rounded-2xl border p-3 text-sm leading-6"></p>
        <div id="deviceQrList" class="mt-5 grid gap-4" aria-live="polite"></div>
      </section>

      <footer class="mt-8 break-words rounded-3xl border border-amber-300/25 bg-amber-300/10 p-4 text-sm leading-6 text-amber-100 sm:p-5">
        <div class="flex flex-wrap items-start justify-between gap-3">
          <div>
            <p class="text-sm font-semibold text-amber-100">教师使用说明</p>
            <h2 class="mt-2 text-xl font-black text-white">生成二维码、下载图片、维护内容</h2>
          </div>
          <span class="rounded-full border border-amber-300/30 bg-slate-950/40 px-3 py-1 text-xs font-semibold text-amber-100">内部使用</span>
        </div>
        <div class="mt-4 grid gap-3 text-xs leading-6 text-amber-50/85 sm:grid-cols-2 lg:grid-cols-4">
          <p><strong class="text-amber-100">二维码：</strong>本页会直接生成每台设备的二维码，可下载 PNG 打印张贴；打印前请先用手机扫码测试。</p>
          <p><strong class="text-amber-100">跨电脑演示：</strong>导出 devices.json 后上传替换 GitHub 仓库 data/devices.json，别人电脑打开线上链接即可看到最新设备。</p>
          <p><strong class="text-amber-100">AI 整理：</strong>可先用 AI 从说明书整理设备介绍、操作步骤、安全须知和 FAQ，再由教师或实验员审核。</p>
          <p><strong class="text-amber-100">学生访问：</strong>部署完成后，学生扫码打开设备页，查看说明、安全须知，并完成基础问答。</p>
        </div>
      </footer>
    </section>
  </main>

  <script>
    const fallbackDevices = [
      {
        id: 'robot-dog',
        name: '机械狗',
        category: '智能硬件 / 机器人设备',
        riskLevel: '中'
      },
      {
        id: 'robot-arm',
        name: '实验设备',
        category: '自动化实验设备',
        riskLevel: '高'
      },
      {
        id: 'experiment-platform',
        name: '火箭发射架',
        category: '高校实验设备 / 发射架模型',
        riskLevel: '中'
      }
    ];

    const deployedBaseUrl = 'https://huhu52.github.io/jst-ai/';
    let currentDevices = [];

    async function loadDevices() {
      try {
        const response = await fetch('data/devices.json', { cache: 'no-store' });
        if (!response.ok) throw new Error('devices.json load failed');
        return prepareDevices(await response.json());
      } catch (error) {
        return prepareDevices(fallbackDevices);
      }
    }

    function readJsonStorage(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (error) {
        return fallback;
      }
    }

    function writeJsonStorage(key, value) {
      localStorage.setItem(key, JSON.stringify(value));
    }

    function readCustomDevices() {
      return readJsonStorage('custom_devices', []);
    }

    function readDeletedDeviceIds() {
      return readJsonStorage('deleted_device_ids', []);
    }

    function prepareDevices(baseDevices) {
      const deletedIds = new Set(readDeletedDeviceIds());
      const merged = [...baseDevices, ...readCustomDevices()];
      const uniqueDevices = Array.from(new Map(merged.map(device => [device.id, device])).values());
      return applyDeviceOverrides(uniqueDevices).filter(device => !deletedIds.has(device.id));
    }

    function applyDeviceOverrides(devices) {
      return devices.map((device) => {
        try {
          const raw = localStorage.getItem(`device_override_${device.id}`);
          return raw ? { ...device, ...JSON.parse(raw), id: device.id } : device;
        } catch (error) {
          return device;
        }
      });
    }

    function showPageMessage(text, type = 'info') {
      const message = document.querySelector('#pageMessage');
      const color = type === 'error'
        ? 'border-red-300/25 bg-red-500/10 text-red-100'
        : 'border-emerald-300/25 bg-emerald-300/10 text-emerald-100';
      message.className = `mt-4 rounded-2xl border p-3 text-sm leading-6 ${color}`;
      message.textContent = text;
      message.classList.remove('hidden');
    }

    function devicePath(deviceId) {
      return `device.html?id=${encodeURIComponent(deviceId)}`;
    }

    function fullDeviceUrl(deviceId) {
      const isLocalPreview = ['file:', 'http:'].includes(window.location.protocol) && ['localhost', '127.0.0.1', ''].includes(window.location.hostname);
      const baseUrl = isLocalPreview ? deployedBaseUrl : new URL('./', window.location.href).href;
      return new URL(devicePath(deviceId), baseUrl).href;
    }

    function teacherDevicePath(deviceId) {
      return `teacher-device.html?id=${encodeURIComponent(deviceId)}`;
    }

    function safeDomId(value) {
      return String(value).replace(/[^a-zA-Z0-9_-]/g, '-');
    }

    async function copyText(text, button) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.setAttribute('readonly', '');
          textarea.style.position = 'fixed';
          textarea.style.opacity = '0';
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          document.body.removeChild(textarea);
        }
        const oldText = button.textContent;
        button.textContent = '已复制';
        button.classList.remove('bg-cyan-300', 'hover:bg-cyan-200');
        button.classList.add('bg-emerald-300', 'hover:bg-emerald-200');
        setTimeout(() => {
          button.textContent = oldText;
          button.classList.add('bg-cyan-300', 'hover:bg-cyan-200');
          button.classList.remove('bg-emerald-300', 'hover:bg-emerald-200');
        }, 1400);
      } catch (error) {
        button.textContent = '复制失败，请手动复制';
      }
    }

    function generateQrCode(container, url) {
      if (typeof QRCode !== 'function') {
        container.innerHTML = '<p class="px-3 py-8 text-center text-xs leading-5 text-amber-100">二维码生成库加载失败，请复制链接后使用外部工具生成。</p>';
        return;
      }

      container.innerHTML = '';
      new QRCode(container, {
        text: url,
        width: 148,
        height: 148,
        colorDark: '#020617',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
    }

    function generateAllQrCodes(devices) {
      devices.forEach((device, index) => {
        const container = document.querySelector(`#qr-${safeDomId(device.id)}`);
        if (container) {
          window.setTimeout(() => generateQrCode(container, fullDeviceUrl(device.id)), index * 90);
        }
      });
    }

    function downloadQrCode(device, button) {
      const container = document.querySelector(`#qr-${safeDomId(device.id)}`);
      const canvas = container?.querySelector('canvas');
      const image = container?.querySelector('img');
      const dataUrl = canvas ? canvas.toDataURL('image/png') : image?.src;

      if (!dataUrl) {
        const oldText = button.textContent;
        button.textContent = '请先复制链接';
        setTimeout(() => {
          button.textContent = oldText;
        }, 1600);
        return;
      }

      const link = document.createElement('a');
      link.href = dataUrl;
      link.download = `贝尔智机通-${device.id}-二维码.png`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function downloadText(filename, text) {
      const blob = new Blob([text], { type: 'application/json;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    function deleteDevice(device) {
      const ok = window.confirm(`确认删除「${device.name}」吗？删除后学生首页和设备页将不再显示该设备。`);
      if (!ok) return;

      const customDevices = readCustomDevices();
      const isCustom = customDevices.some(item => item.id === device.id);
      if (isCustom) {
        writeJsonStorage('custom_devices', customDevices.filter(item => item.id !== device.id));
      } else {
        const deletedIds = new Set(readDeletedDeviceIds());
        deletedIds.add(device.id);
        writeJsonStorage('deleted_device_ids', Array.from(deletedIds));
      }

      localStorage.removeItem(`device_override_${device.id}`);
      localStorage.removeItem(`access_${device.id}`);
      showPageMessage(`已删除「${device.name}」。别人电脑演示请导出 devices.json 并上传到 GitHub。`);
      loadDevices().then(renderDevices);
    }

    function exportLatestDevices() {
      downloadText('devices.json', `${JSON.stringify(currentDevices, null, 2)}\n`);
      showPageMessage('已导出 devices.json。上传替换 GitHub 仓库 data/devices.json 后，别人电脑打开线上链接即可同步看到。');
    }

    function deviceModelAsset(deviceId) {
      const modelMap = {
        'robot-dog': 'assets/model-robot-dog.webp',
        'robot-arm': 'assets/model-experiment-device.webp',
        'experiment-platform': 'assets/model-rocket-frame.webp'
      };
      return modelMap[deviceId] || 'assets/model-experiment-device.webp';
    }

    function renderDevices(devices) {
      currentDevices = devices;
      const list = document.querySelector('#deviceQrList');
      if (!devices.length) {
        list.innerHTML = `
          <section class="rounded-2xl border border-amber-300/25 bg-amber-300/10 p-5 text-sm leading-7 text-amber-100">
            当前没有可展示设备。请点击“新增设备”添加第一台设备。
          </section>
        `;
        return;
      }

      list.innerHTML = devices.map((device) => {
        const fullUrl = fullDeviceUrl(device.id);
        const qrId = `qr-${safeDomId(device.id)}`;
        return `
          <article class="grid min-w-0 gap-4 rounded-2xl border border-slate-700 bg-slate-950/70 p-4 lg:grid-cols-[1fr_auto] lg:items-start">
            <div class="min-w-0">
              <div class="device-model-thumb mb-4 rounded-2xl border border-cyan-300/15">
                <img src="${deviceModelAsset(device.id)}" alt="${device.name}机械模型展示" loading="lazy" decoding="async" class="h-full w-full object-cover" />
              </div>
              <div class="flex flex-wrap items-start justify-between gap-3">
                <div class="min-w-0">
                  <h3 class="break-words text-lg font-bold text-white">${device.name}</h3>
                  <p class="mt-1 break-words text-sm text-slate-400">${device.category}</p>
                </div>
              </div>
              <div class="mt-4 rounded-2xl border border-cyan-300/20 bg-cyan-300/10 p-3">
                <p class="text-xs text-cyan-100/70">设备访问链接</p>
                <p class="mt-2 break-all font-mono text-sm leading-6 text-cyan-50">${fullUrl}</p>
              </div>
              <div class="mt-4 flex flex-col gap-3 sm:flex-row sm:flex-wrap">
                <a href="${teacherDevicePath(device.id)}" class="inline-flex min-h-12 w-full items-center justify-center rounded-xl border border-slate-700 bg-slate-900 px-4 py-3 text-sm font-bold text-cyan-100 hover:border-cyan-300/60 sm:w-auto">打开编辑页</a>
                <button type="button" class="copy-link inline-flex min-h-12 w-full items-center justify-center rounded-xl bg-cyan-300 px-4 py-3 text-sm font-bold text-slate-950 hover:bg-cyan-200 sm:w-auto" data-url="${fullUrl}">复制链接</button>
                <button type="button" class="download-qr inline-flex min-h-12 w-full items-center justify-center rounded-xl border border-emerald-300/40 bg-emerald-300/10 px-4 py-3 text-sm font-bold text-emerald-100 hover:border-emerald-200 sm:w-auto" data-device-id="${device.id}">下载二维码</button>
                <button type="button" class="delete-device inline-flex min-h-12 w-full items-center justify-center rounded-xl border border-red-300/30 bg-red-500/10 px-4 py-3 text-sm font-bold text-red-100 hover:bg-red-500/15 sm:w-auto" data-device-id="${device.id}">删除设备</button>
              </div>
            </div>
            <div class="mx-auto w-full max-w-[190px] rounded-2xl border border-white/10 bg-white p-3 lg:mx-0">
              <div id="${qrId}" class="grid min-h-[148px] place-items-center"></div>
              <p class="mt-3 text-center text-xs font-bold text-slate-950">${device.name}设备页</p>
            </div>
          </article>
        `;
      }).join('');

      document.querySelectorAll('.copy-link').forEach((button) => {
        button.addEventListener('click', () => copyText(button.dataset.url, button));
      });

      document.querySelectorAll('.download-qr').forEach((button) => {
        const device = devices.find((item) => item.id === button.dataset.deviceId);
        if (device) button.addEventListener('click', () => downloadQrCode(device, button));
      });

      document.querySelectorAll('.delete-device').forEach((button) => {
        const device = devices.find((item) => item.id === button.dataset.deviceId);
        if (device) button.addEventListener('click', () => deleteDevice(device));
      });

      generateAllQrCodes(devices);
    }

    document.querySelector('#exportDevicesBtn').addEventListener('click', exportLatestDevices);
    loadDevices().then(renderDevices);
  </script>
</body>
</html>
