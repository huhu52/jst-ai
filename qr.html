<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="机设通 AI 二维码部署页，供教师、实验员或项目维护人员复制设备链接并生成二维码。" />
  <title>二维码部署页 - 机设通 AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            tech: {
              blue: '#38bdf8',
              cyan: '#22d3ee',
              orange: '#f59e0b',
              red: '#ef4444'
            }
          },
          boxShadow: {
            glow: '0 0 36px rgba(56, 189, 248, 0.18)'
          }
        }
      }
    };
  </script>
  <style>
    html,
    body {
      max-width: 100%;
      overflow-x: hidden;
    }

    .tech-bg {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 16%, rgba(34, 211, 238, 0.14), transparent 28%),
        radial-gradient(circle at 82% 18%, rgba(59, 130, 246, 0.12), transparent 30%),
        linear-gradient(180deg, #06111f 0%, #071827 48%, #020617 100%);
    }

    .tech-bg::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(148, 163, 184, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148, 163, 184, 0.08) 1px, transparent 1px),
        linear-gradient(rgba(34, 211, 238, 0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34, 211, 238, 0.1) 1px, transparent 1px);
      background-size: 32px 32px, 32px 32px, 160px 160px, 160px 160px;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0.25));
      animation: gridDrift 28s linear infinite;
    }

    .tech-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(115deg, transparent 0 38%, rgba(34, 211, 238, 0.08) 46%, transparent 56% 100%),
        radial-gradient(circle at 70% 42%, rgba(14, 165, 233, 0.14), transparent 18%);
      animation: lightShift 16s ease-in-out infinite alternate;
    }

    .tech-grid {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, transparent 0 9%, rgba(34, 211, 238, 0.12) 9.2%, transparent 9.5% 100%),
        linear-gradient(180deg, transparent 0 28%, rgba(34, 211, 238, 0.1) 28.2%, transparent 28.5% 100%);
      opacity: 0.45;
    }

    .scan-line,
    .particle {
      display: none;
    }

    @keyframes gridDrift {
      from { background-position: 0 0, 0 0, 0 0, 0 0; }
      to { background-position: 32px 32px, 32px 32px, 80px 80px, 80px 80px; }
    }

    @keyframes lightShift {
      from { opacity: 0.45; transform: translate3d(-2%, 0, 0); }
      to { opacity: 0.9; transform: translate3d(2%, -1%, 0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .tech-bg::before,
      .tech-bg::after {
        animation: none;
      }
    }
  </style>
</head>
<body class="min-h-screen overflow-x-hidden bg-slate-950 text-slate-100 antialiased">
  <main class="relative min-h-screen overflow-hidden">
    <div class="tech-bg">
      <div class="tech-grid"></div>
      <div class="scan-line"></div>
      <span class="particle"></span>
      <span class="particle"></span>
      <span class="particle"></span>
      <span class="particle"></span>
    </div>

    <section class="relative mx-auto w-full max-w-6xl px-4 py-6 sm:px-8 lg:px-10">
      <header class="flex flex-wrap items-center justify-between gap-3">
        <div class="inline-flex min-h-10 items-center gap-3 text-sm font-semibold text-cyan-100">
          <img src="assets/jst-logo.svg" alt="机设通 AI" class="h-14 w-auto max-w-[14rem] drop-shadow-[0_0_16px_rgba(34,211,238,0.18)]" />
          <span class="hidden sm:inline">教师/实验员专用入口</span>
        </div>
        <span class="hidden rounded-full border border-cyan-300/30 bg-cyan-300/10 px-3 py-1 text-xs font-semibold text-cyan-100 sm:inline-flex">二维码部署页</span>
      </header>

      <section class="mt-10 rounded-3xl border border-slate-700 bg-slate-900/75 p-4 sm:p-6">
        <div class="flex flex-wrap items-start justify-between gap-3">
          <div class="min-w-0">
            <p class="text-sm font-semibold text-cyan-200">设备链接列表</p>
            <h2 class="mt-2 break-words text-2xl font-black text-white">二维码部署</h2>
          </div>
          <span class="hidden rounded-full border border-emerald-300/30 bg-emerald-300/10 px-3 py-1 text-xs font-bold text-emerald-100 sm:inline-flex">本页直接生成二维码</span>
        </div>
        <div id="deviceQrList" class="mt-5 grid gap-4" aria-live="polite"></div>
      </section>

      <footer class="mt-8 break-words rounded-3xl border border-amber-300/25 bg-amber-300/10 p-4 text-sm leading-6 text-amber-100 sm:p-5">
        <div class="flex flex-wrap items-start justify-between gap-3">
          <div>
            <p class="text-sm font-semibold text-amber-100">教师使用说明</p>
            <h2 class="mt-2 text-xl font-black text-white">生成二维码、下载图片、维护内容</h2>
          </div>
          <span class="rounded-full border border-amber-300/30 bg-slate-950/40 px-3 py-1 text-xs font-semibold text-amber-100">内部使用</span>
        </div>
        <div class="mt-4 grid gap-3 text-xs leading-6 text-amber-50/85 sm:grid-cols-2 lg:grid-cols-4">
          <p><strong class="text-amber-100">二维码：</strong>本页会直接生成每台设备的二维码，可下载 PNG 打印张贴；打印前请先用手机扫码测试。</p>
          <p><strong class="text-amber-100">内容维护：</strong>设备资料维护在 data/devices.json，FAQ 维护在 data/faq.json，新增设备时保证 id 唯一。</p>
          <p><strong class="text-amber-100">AI 整理：</strong>可先用 AI 从说明书整理设备介绍、操作步骤、安全须知和 FAQ，再由教师或实验员审核。</p>
          <p><strong class="text-amber-100">学生访问：</strong>部署完成后，学生扫码打开设备页，查看说明、安全须知，并完成基础问答。</p>
        </div>
      </footer>
    </section>
  </main>

  <script>
    const fallbackDevices = [
      {
        id: 'robot-dog',
        name: '机器狗',
        category: '智能硬件 / 机器人设备',
        riskLevel: '中'
      },
      {
        id: 'robot-arm',
        name: '机械臂',
        category: '机械控制设备',
        riskLevel: '高'
      },
      {
        id: 'experiment-platform',
        name: '实验教学平台',
        category: '高校实验设备',
        riskLevel: '中'
      }
    ];

    const deployedBaseUrl = 'https://huhu52.github.io/jst-ai/';

    async function loadDevices() {
      try {
        const response = await fetch('data/devices.json', { cache: 'no-store' });
        if (!response.ok) throw new Error('devices.json load failed');
        return applyDeviceOverrides(await response.json());
      } catch (error) {
        return applyDeviceOverrides(fallbackDevices);
      }
    }

    function applyDeviceOverrides(devices) {
      return devices.map((device) => {
        try {
          const raw = localStorage.getItem(`device_override_${device.id}`);
          return raw ? { ...device, ...JSON.parse(raw), id: device.id } : device;
        } catch (error) {
          return device;
        }
      });
    }

    function devicePath(deviceId) {
      return `device.html?id=${encodeURIComponent(deviceId)}`;
    }

    function fullDeviceUrl(deviceId) {
      const isLocalPreview = ['file:', 'http:'].includes(window.location.protocol) && ['localhost', '127.0.0.1', ''].includes(window.location.hostname);
      const baseUrl = isLocalPreview ? deployedBaseUrl : new URL('./', window.location.href).href;
      return new URL(devicePath(deviceId), baseUrl).href;
    }

    function teacherDevicePath(deviceId) {
      return `teacher-device.html?id=${encodeURIComponent(deviceId)}`;
    }

    function safeDomId(value) {
      return String(value).replace(/[^a-zA-Z0-9_-]/g, '-');
    }

    async function copyText(text, button) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.setAttribute('readonly', '');
          textarea.style.position = 'fixed';
          textarea.style.opacity = '0';
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          document.body.removeChild(textarea);
        }
        const oldText = button.textContent;
        button.textContent = '已复制';
        button.classList.remove('bg-cyan-300', 'hover:bg-cyan-200');
        button.classList.add('bg-emerald-300', 'hover:bg-emerald-200');
        setTimeout(() => {
          button.textContent = oldText;
          button.classList.add('bg-cyan-300', 'hover:bg-cyan-200');
          button.classList.remove('bg-emerald-300', 'hover:bg-emerald-200');
        }, 1400);
      } catch (error) {
        button.textContent = '复制失败，请手动复制';
      }
    }

    function generateQrCode(container, url) {
      if (typeof QRCode !== 'function') {
        container.innerHTML = '<p class="px-3 py-8 text-center text-xs leading-5 text-amber-100">二维码生成库加载失败，请复制链接后使用外部工具生成。</p>';
        return;
      }

      container.innerHTML = '';
      new QRCode(container, {
        text: url,
        width: 168,
        height: 168,
        colorDark: '#020617',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
    }

    function generateAllQrCodes(devices) {
      devices.forEach((device) => {
        const container = document.querySelector(`#qr-${safeDomId(device.id)}`);
        if (container) generateQrCode(container, fullDeviceUrl(device.id));
      });
    }

    function downloadQrCode(device, button) {
      const container = document.querySelector(`#qr-${safeDomId(device.id)}`);
      const canvas = container?.querySelector('canvas');
      const image = container?.querySelector('img');
      const dataUrl = canvas ? canvas.toDataURL('image/png') : image?.src;

      if (!dataUrl) {
        const oldText = button.textContent;
        button.textContent = '请先复制链接';
        setTimeout(() => {
          button.textContent = oldText;
        }, 1600);
        return;
      }

      const link = document.createElement('a');
      link.href = dataUrl;
      link.download = `机设通AI-${device.id}-二维码.png`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function renderDevices(devices) {
      const list = document.querySelector('#deviceQrList');
      list.innerHTML = devices.map((device) => {
        const fullUrl = fullDeviceUrl(device.id);
        const qrId = `qr-${safeDomId(device.id)}`;
        return `
          <article class="grid min-w-0 gap-4 rounded-2xl border border-slate-700 bg-slate-950/70 p-4 lg:grid-cols-[1fr_auto] lg:items-start">
            <div class="min-w-0">
              <div class="flex flex-wrap items-start justify-between gap-3">
                <div class="min-w-0">
                  <h3 class="break-words text-lg font-bold text-white">${device.name}</h3>
                  <p class="mt-1 break-words text-sm text-slate-400">${device.category}</p>
                </div>
                <span class="shrink-0 rounded-full border border-amber-300/30 bg-amber-300/10 px-2.5 py-1 text-xs font-semibold text-amber-100">风险 ${device.riskLevel}</span>
              </div>
              <div class="mt-4 rounded-2xl border border-cyan-300/20 bg-cyan-300/10 p-3">
                <p class="text-xs text-cyan-100/70">设备访问链接</p>
                <p class="mt-2 break-all font-mono text-sm leading-6 text-cyan-50">${fullUrl}</p>
              </div>
              <div class="mt-4 flex flex-col gap-3 sm:flex-row sm:flex-wrap">
                <a href="${teacherDevicePath(device.id)}" class="inline-flex min-h-12 w-full items-center justify-center rounded-xl border border-slate-700 bg-slate-900 px-4 py-3 text-sm font-bold text-cyan-100 transition hover:border-cyan-300/60 sm:w-auto">打开编辑页</a>
                <button type="button" class="copy-link inline-flex min-h-12 w-full items-center justify-center rounded-xl bg-cyan-300 px-4 py-3 text-sm font-bold text-slate-950 transition hover:bg-cyan-200 sm:w-auto" data-url="${fullUrl}">复制链接</button>
                <button type="button" class="download-qr inline-flex min-h-12 w-full items-center justify-center rounded-xl border border-emerald-300/40 bg-emerald-300/10 px-4 py-3 text-sm font-bold text-emerald-100 transition hover:border-emerald-200 sm:w-auto" data-device-id="${device.id}">下载二维码</button>
              </div>
            </div>
            <div class="mx-auto w-full max-w-[220px] rounded-2xl border border-white/10 bg-white p-3 shadow-glow lg:mx-0">
              <div id="${qrId}" class="grid min-h-[168px] place-items-center"></div>
              <p class="mt-3 text-center text-xs font-bold text-slate-950">${device.name}设备页</p>
            </div>
          </article>
        `;
      }).join('');

      document.querySelectorAll('.copy-link').forEach((button) => {
        button.addEventListener('click', () => copyText(button.dataset.url, button));
      });

      document.querySelectorAll('.download-qr').forEach((button) => {
        const device = devices.find((item) => item.id === button.dataset.deviceId);
        if (device) button.addEventListener('click', () => downloadQrCode(device, button));
      });

      generateAllQrCodes(devices);
    }

    loadDevices().then(renderDevices);
  </script>
</body>
</html>
