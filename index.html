<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="机设通 AI，高校机械实验设备扫码操作与智能问答助手。" />
  <title>机设通 AI - 高校机械实验设备扫码操作与智能问答助手</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            tech: {
              blue: '#38bdf8',
              cyan: '#22d3ee',
              orange: '#f59e0b',
              red: '#ef4444',
              panel: '#0f172a'
            }
          },
          boxShadow: {
            glow: '0 0 36px rgba(56, 189, 248, 0.18)'
          }
        }
      }
    };
  </script>
  <style>
    html,
    body {
      max-width: 100%;
      overflow-x: hidden;
    }

    .tech-bg {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 16%, rgba(34, 211, 238, 0.14), transparent 28%),
        radial-gradient(circle at 82% 18%, rgba(59, 130, 246, 0.12), transparent 30%),
        linear-gradient(180deg, #06111f 0%, #071827 48%, #020617 100%);
    }

    .tech-bg::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(148, 163, 184, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148, 163, 184, 0.08) 1px, transparent 1px),
        linear-gradient(rgba(34, 211, 238, 0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34, 211, 238, 0.1) 1px, transparent 1px);
      background-size: 32px 32px, 32px 32px, 160px 160px, 160px 160px;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0.25));
      animation: gridDrift 28s linear infinite;
    }

    .tech-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(115deg, transparent 0 38%, rgba(34, 211, 238, 0.08) 46%, transparent 56% 100%),
        radial-gradient(circle at 70% 42%, rgba(14, 165, 233, 0.14), transparent 18%);
      animation: lightShift 16s ease-in-out infinite alternate;
    }

    .tech-grid {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, transparent 0 9%, rgba(34, 211, 238, 0.12) 9.2%, transparent 9.5% 100%),
        linear-gradient(180deg, transparent 0 28%, rgba(34, 211, 238, 0.1) 28.2%, transparent 28.5% 100%);
      opacity: 0.45;
    }

    .scan-line,
    .particle {
      display: none;
    }

    @keyframes gridDrift {
      from { background-position: 0 0, 0 0, 0 0, 0 0; }
      to { background-position: 32px 32px, 32px 32px, 80px 80px, 80px 80px; }
    }

    @keyframes lightShift {
      from { opacity: 0.45; transform: translate3d(-2%, 0, 0); }
      to { opacity: 0.9; transform: translate3d(2%, -1%, 0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .tech-bg::before,
      .tech-bg::after {
        animation: none;
      }
    }
  </style>
</head>
<body class="min-h-screen overflow-x-hidden bg-slate-950 text-slate-100 antialiased">
  <main class="relative overflow-hidden">
    <div class="tech-bg">
      <div class="tech-grid"></div>
      <div class="scan-line"></div>
      <span class="particle"></span>
      <span class="particle"></span>
      <span class="particle"></span>
      <span class="particle"></span>
    </div>

    <section class="relative mx-auto flex min-h-screen w-full max-w-6xl flex-col px-4 py-6 sm:px-8 sm:py-8 lg:px-10">
      <header class="flex flex-wrap items-center justify-between gap-3 sm:gap-4">
        <a href="index.html" class="flex items-center gap-3" aria-label="机设通 AI 首页">
          <img src="assets/jst-logo.svg" alt="机设通 AI" class="h-14 w-auto max-w-[14rem] drop-shadow-[0_0_16px_rgba(34,211,238,0.18)]" />
          <span class="hidden min-w-0 sm:block">
            <span class="block text-base font-semibold tracking-wide text-white">机设通 AI</span>
            <span class="block text-xs text-slate-400">扫码操作与安全问答</span>
          </span>
        </a>
        <div class="flex flex-wrap items-center gap-2">
          <span class="hidden rounded-full border border-amber-300/30 bg-amber-300/10 px-3 py-1 text-xs font-medium text-amber-200 sm:inline-flex">实验安全优先</span>
        </div>
      </header>

      <div class="grid flex-1 items-start gap-8 py-12 sm:gap-10 sm:py-16 lg:grid-cols-[1fr_1fr] lg:items-center">
        <section class="min-w-0">
          <p class="mb-4 inline-block max-w-full break-all rounded-full border border-cyan-300/30 bg-cyan-300/10 px-3 py-1 text-sm leading-6 text-cyan-100 sm:break-words">高校机械实验设备扫码操作与智能问答助手</p>
          <h1 class="max-w-3xl break-words text-[2.4rem] font-black leading-tight text-white sm:text-5xl lg:text-6xl">机设通 AI</h1>
          <p class="mt-5 max-w-2xl break-words text-lg font-semibold leading-8 text-cyan-100 sm:text-2xl">
            <span class="block sm:inline">高校机械实验设备扫码操作</span>
            <span class="block sm:inline">与智能问答助手</span>
          </p>
          <p class="mt-5 max-w-2xl text-base leading-8 text-slate-300 sm:text-lg">
            <span class="block">扫码或选择设备后，查看操作指南和安全须知。</span>
            <span class="block">完成安全确认后，可进行基础问题咨询。</span>
          </p>
          <div class="mt-7 flex flex-col gap-3 sm:flex-row sm:flex-wrap">
            <button id="scanQrBtn" type="button" class="inline-flex min-h-12 w-full items-center justify-center rounded-xl bg-cyan-300 px-5 py-3 text-sm font-black text-slate-950 transition hover:-translate-y-0.5 hover:bg-cyan-200 sm:w-auto">扫描设备二维码</button>
            <a href="#deviceExamples" class="inline-flex min-h-12 w-full items-center justify-center rounded-xl bg-cyan-300 px-5 py-3 text-sm font-black text-slate-950 transition hover:-translate-y-0.5 hover:bg-cyan-200 sm:w-auto">选择设备</a>
            <a href="#safetyNotice" class="inline-flex min-h-12 w-full items-center justify-center rounded-xl border border-amber-300/35 bg-amber-300/10 px-5 py-3 text-sm font-black text-amber-100 transition hover:-translate-y-0.5 hover:bg-amber-300/15 sm:w-auto">查看安全说明</a>
          </div>
        </section>

        <section id="deviceExamples" class="min-w-0 rounded-3xl border border-cyan-300/20 bg-slate-900/75 p-4 shadow-glow backdrop-blur sm:p-5">
          <div class="mb-5 flex flex-wrap items-center justify-between gap-3">
            <div class="min-w-0">
              <h2 class="text-xl font-bold text-white">选择实验设备</h2>
              <p class="mt-1 text-sm leading-6 text-slate-400">
                <span class="block">请选择当前要查看的实验设备。</span>
                <span class="block">现场也可扫描设备旁二维码直接进入。</span>
              </p>
            </div>
          </div>
          <div id="deviceList" class="grid gap-4" aria-live="polite"></div>
        </section>
      </div>

      <footer id="safetyNotice" class="relative break-words rounded-3xl border border-amber-300/25 bg-gradient-to-br from-amber-300/15 to-slate-900/80 p-5 text-sm leading-7 text-amber-100 shadow-[0_0_28px_rgba(245,158,11,0.08)]">
        <strong class="text-amber-200">安全免责声明：</strong>
        本工具仅作为实验教学辅助说明，不能替代教师、实验员现场指导。涉及设备启动、控制参数修改、维修、异常处理等操作时，请以实验室制度和教师要求为准。
      </footer>
    </section>
  </main>

  <div id="scannerModal" class="fixed inset-0 z-50 hidden bg-slate-950/90 px-4 py-6 backdrop-blur">
    <div class="mx-auto flex min-h-full w-full max-w-lg items-center justify-center">
      <section class="w-full overflow-hidden rounded-3xl border border-cyan-300/30 bg-slate-900 shadow-glow">
        <div class="flex items-start justify-between gap-4 border-b border-slate-700 p-4">
          <div>
            <p class="text-sm font-semibold text-cyan-200">设备二维码扫描</p>
            <h2 class="mt-1 text-2xl font-black text-white">对准设备二维码</h2>
          </div>
          <button id="closeScannerBtn" type="button" class="rounded-xl border border-slate-700 bg-slate-950 px-3 py-2 text-sm font-bold text-slate-100">关闭</button>
        </div>
        <div class="p-4">
          <div class="relative aspect-[3/4] overflow-hidden rounded-2xl border border-cyan-300/25 bg-slate-950">
            <video id="scannerVideo" class="h-full w-full object-cover" playsinline muted></video>
            <div class="pointer-events-none absolute inset-8 rounded-2xl border-2 border-cyan-300/70 shadow-[0_0_28px_rgba(34,211,238,0.35)]"></div>
          </div>
          <canvas id="scannerCanvas" class="hidden"></canvas>
          <p id="scannerStatus" class="mt-4 rounded-2xl border border-cyan-300/20 bg-cyan-300/10 p-3 text-sm leading-6 text-cyan-50">正在准备摄像头...</p>
          <label class="mt-3 flex min-h-12 cursor-pointer items-center justify-center rounded-xl border border-cyan-300/30 bg-cyan-300/10 px-4 py-3 text-sm font-bold text-cyan-100">
            上传二维码图片识别
            <input id="qrImageInput" type="file" accept="image/*" capture="environment" class="sr-only" />
          </label>
        </div>
      </section>
    </div>
  </div>

  <script>
    const fallbackDevices = [
      {
        id: 'robot-dog',
        name: '机器狗',
        category: '智能硬件 / 机器人设备',
        riskLevel: '中',
        description: '用于机器人运动控制、智能交互和机械结构教学。'
      },
      {
        id: 'robot-arm',
        name: '机械臂',
        category: '机械控制设备',
        riskLevel: '高',
        description: '用于机械控制、轨迹规划、夹取搬运和自动化实验教学。'
      },
      {
        id: 'experiment-platform',
        name: '实验教学平台',
        category: '高校实验设备',
        riskLevel: '中',
        description: '用于课程实验、项目展示、传感器采集和机械系统综合教学。'
      }
    ];

    async function loadDevices() {
      try {
        const response = await fetch('data/devices.json', { cache: 'no-store' });
        if (!response.ok) throw new Error('devices.json load failed');
        return applyDeviceOverrides(await response.json());
      } catch (error) {
        return applyDeviceOverrides(fallbackDevices);
      }
    }

    function applyDeviceOverrides(devices) {
      return devices.map((device) => {
        try {
          const raw = localStorage.getItem(`device_override_${device.id}`);
          return raw ? { ...device, ...JSON.parse(raw), id: device.id } : device;
        } catch (error) {
          return device;
        }
      });
    }

    let scannerStream = null;
    let scannerActive = false;

    function setScannerStatus(text, type = 'info') {
      const status = document.querySelector('#scannerStatus');
      const color = type === 'error'
        ? 'border-red-300/25 bg-red-500/10 text-red-100'
        : 'border-cyan-300/20 bg-cyan-300/10 text-cyan-50';
      status.className = `mt-4 rounded-2xl border p-3 text-sm leading-6 ${color}`;
      status.textContent = text;
    }

    function stopScanner() {
      scannerActive = false;
      if (scannerStream) {
        scannerStream.getTracks().forEach(track => track.stop());
        scannerStream = null;
      }
      document.querySelector('#scannerVideo').srcObject = null;
      document.querySelector('#scannerModal').classList.add('hidden');
    }

    function openScannedUrl(rawValue) {
      try {
        const url = new URL(rawValue, window.location.href);
        if (!url.pathname.endsWith('/device.html') && !url.pathname.endsWith('device.html')) {
          setScannerStatus('未识别到设备页面链接，请扫描设备旁的专用二维码。', 'error');
          return;
        }
        stopScanner();
        window.location.href = url.href;
      } catch (error) {
        setScannerStatus('二维码内容不是有效链接，请重新扫描设备二维码。', 'error');
      }
    }

    async function startScanner() {
      const modal = document.querySelector('#scannerModal');
      const video = document.querySelector('#scannerVideo');
      modal.classList.remove('hidden');
      setScannerStatus('正在请求摄像头权限...');

      if (typeof window.jsQR !== 'function') {
        setScannerStatus('二维码识别库加载失败。请检查网络后刷新页面，或使用下方上传二维码图片识别。', 'error');
        return;
      }

      try {
        scannerStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false
        });
        video.srcObject = scannerStream;
        await video.play();
        scannerActive = true;
        setScannerStatus('请将设备二维码放入取景框内。');

        const canvas = document.querySelector('#scannerCanvas');
        const context = canvas.getContext('2d', { willReadFrequently: true });
        const scan = () => {
          if (!scannerActive) return;
          if (video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth > 0) {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
            const code = window.jsQR(imageData.data, imageData.width, imageData.height, {
              inversionAttempts: 'dontInvert'
            });
            if (code?.data) {
              openScannedUrl(code.data);
              return;
            }
          }
          window.requestAnimationFrame(scan);
        };
        scan();
      } catch (error) {
        setScannerStatus('无法打开摄像头。请允许浏览器摄像头权限，或点击下方按钮拍照/上传二维码图片识别。', 'error');
      }
    }

    function decodeImageFile(file) {
      if (!file || typeof window.jsQR !== 'function') return;
      const image = new Image();
      image.onload = () => {
        const canvas = document.querySelector('#scannerCanvas');
        const context = canvas.getContext('2d', { willReadFrequently: true });
        canvas.width = image.naturalWidth;
        canvas.height = image.naturalHeight;
        context.drawImage(image, 0, 0);
        const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
        const code = window.jsQR(imageData.data, imageData.width, imageData.height, {
          inversionAttempts: 'attemptBoth'
        });
        URL.revokeObjectURL(image.src);
        if (code?.data) {
          openScannedUrl(code.data);
        } else {
          setScannerStatus('这张图片里没有识别到设备二维码，请重新拍摄或上传更清晰的二维码图片。', 'error');
        }
      };
      image.onerror = () => setScannerStatus('图片读取失败，请重新选择二维码图片。', 'error');
      image.src = URL.createObjectURL(file);
    }

    function setupQrScanner() {
      const button = document.querySelector('#scanQrBtn');
      const closeButton = document.querySelector('#closeScannerBtn');
      const imageInput = document.querySelector('#qrImageInput');
      button.addEventListener('click', startScanner);
      closeButton.addEventListener('click', stopScanner);
      imageInput.addEventListener('change', event => decodeImageFile(event.target.files[0]));
    }

    function renderDevices(devices) {
      const list = document.querySelector('#deviceList');
      list.innerHTML = devices.map((device) => `
        <a href="device.html?id=${encodeURIComponent(device.id)}" class="group block min-h-32 rounded-2xl border border-slate-700 bg-slate-950/70 p-4 transition hover:-translate-y-1 hover:border-cyan-300/60 hover:bg-slate-900 hover:shadow-glow">
          <div class="flex flex-wrap items-start justify-between gap-3">
            <div class="min-w-0">
              <h3 class="break-words text-lg font-bold text-white group-hover:text-cyan-100">${device.name}</h3>
              <p class="mt-1 break-words text-sm text-slate-400">${device.category}</p>
            </div>
            <span class="shrink-0 rounded-full border px-2.5 py-1 text-xs font-bold ${device.riskLevel === '高' ? 'border-red-300/40 bg-red-400/15 text-red-100' : 'border-amber-300/35 bg-amber-300/12 text-amber-100'}">风险 ${device.riskLevel}</span>
          </div>
          <p class="mt-3 break-words text-sm leading-6 text-slate-300">${device.description}</p>
          <span class="mt-4 inline-flex min-h-10 items-center rounded-xl bg-cyan-300/10 px-3 py-2 text-sm font-bold text-cyan-100 transition group-hover:bg-cyan-300 group-hover:text-slate-950">进入设备页 <span class="ml-1 transition group-hover:translate-x-1">→</span></span>
        </a>
      `).join('');

    }

    setupQrScanner();
    loadDevices().then(renderDevices);
  </script>
</body>
</html>
