<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="贝尔智机通设备详情页。" />
  <title>设备详情 - 贝尔智机通</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            tech: {
              blue: '#38bdf8',
              cyan: '#22d3ee',
              orange: '#f59e0b',
              red: '#ef4444'
            }
          },
          boxShadow: {
            glow: '0 0 36px rgba(56, 189, 248, 0.18)'
          }
        }
      }
    };
  </script>
  <style>
    html,
    body {
      max-width: 100%;
      overflow-x: hidden;
    }

    #deviceRoot,
    #deviceRoot * {
      box-sizing: border-box;
      max-width: 100%;
    }

    #deviceRoot p,
    #deviceRoot li,
    #deviceRoot h1,
    #deviceRoot h2,
    #deviceRoot h3 {
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .assistant-float {
      position: fixed;
      right: 1rem;
      bottom: 1.25rem;
      z-index: 60;
      touch-action: none;
      user-select: none;
      cursor: grab;
    }

    .assistant-float.is-dragging {
      cursor: grabbing;
      transition: none;
    }

    .device-hero {
      max-width: calc(100vw - 2rem);
      overflow: hidden;
    }

    .device-description {
      max-width: calc(100vw - 4rem);
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .device-model-stage {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at 48% 24%, rgba(34, 211, 238, 0.18), transparent 35%),
        linear-gradient(135deg, rgba(8, 47, 73, 0.86), rgba(2, 6, 23, 0.92));
    }

    .device-model-stage::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(rgba(34, 211, 238, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34, 211, 238, 0.08) 1px, transparent 1px);
      background-size: 24px 24px;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.85), transparent 92%);
    }

    .device-model-stage::after {
      content: "";
      position: absolute;
      left: -15%;
      top: 12%;
      height: 2px;
      width: 130%;
      background: linear-gradient(90deg, transparent, rgba(103, 232, 249, 0.82), transparent);
      animation: modelScan 4.2s ease-in-out infinite;
    }

    .device-model-image {
      width: 100%;
      object-fit: contain;
      filter: drop-shadow(0 24px 42px rgba(34, 211, 238, 0.16));
      animation: modelFloat 6s ease-in-out infinite;
    }

    @keyframes modelFloat {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-8px) scale(1.015); }
    }

    @keyframes modelScan {
      0%, 100% { transform: translateY(-70px); opacity: 0; }
      18%, 72% { opacity: 1; }
      50% { transform: translateY(250px); }
    }

    @media (min-width: 640px) {
      .assistant-float {
        right: 1.75rem;
        bottom: 1.75rem;
      }

      .device-hero,
      .device-description {
        max-width: 100%;
      }
    }
  </style>
</head>
<body class="min-h-screen overflow-x-hidden bg-slate-950 text-slate-100 antialiased">
  <main class="relative min-h-screen overflow-hidden">
    <div class="absolute inset-0 pointer-events-none">
      <div class="absolute left-0 top-0 h-72 w-72 rounded-full bg-cyan-500/10 blur-3xl"></div>
      <div class="absolute bottom-0 right-0 h-80 w-80 rounded-full bg-blue-500/10 blur-3xl"></div>
      <div class="absolute inset-0 bg-[linear-gradient(rgba(56,189,248,0.055)_1px,transparent_1px),linear-gradient(90deg,rgba(56,189,248,0.055)_1px,transparent_1px)] bg-[size:28px_28px]"></div>
    </div>

    <div class="relative mx-auto w-full max-w-5xl px-4 py-6 sm:px-8 lg:px-10">
      <header class="mb-8 flex flex-wrap items-center justify-between gap-3 sm:gap-4">
        <a id="headerLogoLink" href="index.html" class="inline-flex items-center gap-3" aria-label="返回贝尔智机通首页">
          <img src="assets/jst-logo.svg" alt="贝尔智机通" class="h-12 w-auto max-w-[13rem] drop-shadow-[0_0_16px_rgba(34,211,238,0.18)]" />
        </a>
        <div class="flex items-center gap-2">
          <a id="headerBackLink" href="index.html" class="inline-flex min-h-10 items-center gap-2 rounded-xl border border-cyan-300/25 bg-cyan-300/10 px-3 text-sm font-semibold text-cyan-100 hover:text-white">
            <span>←</span>
            <span id="headerBackText">返回首页</span>
          </a>
          <span class="hidden max-w-full rounded-full border border-amber-300/30 bg-amber-300/10 px-3 py-1 text-xs font-medium leading-5 text-amber-200 sm:inline-flex">现场操作请听从教师指导</span>
        </div>
      </header>

      <section id="teacherPreviewNotice" class="hidden"></section>
      <section id="deviceRoot" aria-live="polite"></section>

      <footer class="mt-8 break-words rounded-2xl border border-amber-300/25 bg-amber-300/10 p-4 text-sm leading-6 text-amber-100">
        <strong class="text-amber-200">安全免责声明：</strong>
        本工具仅作为实验教学辅助说明，不能替代教师、实验员现场指导。涉及设备启动、控制参数修改、维修、异常处理等操作时，请以实验室制度和教师要求为准。
      </footer>
    </div>
  </main>

  <script>
    const fallbackDevices = [
      {
        id: 'robot-dog',
        name: '机械狗',
        category: '智能硬件 / 机器人设备',
        riskLevel: '中',

        scenarios: ['机器人运动控制实验', '智能硬件展示', '机械结构与控制系统教学', '人机交互实验'],
        checks: ['检查设备电量是否充足', '检查设备外壳和关节结构是否完好', '确认周围地面平整、无障碍物', '检查遥控器或控制终端连接状态'],
        steps: ['将机器狗放置在平整地面', '打开设备电源', '等待设备完成初始化', '连接遥控器或控制终端', '选择基础运动模式'],
        warnings: ['设备运行时不要站在机器狗正前方或关节运动区域内', '不要强行拖拽机器狗腿部结构', '出现异常抖动、失控或摔倒时，应立即停止运行'],
        aiUrl: ''
      },
      {
        id: 'robot-arm',
        name: '实验设备',
        category: '自动化实验设备',
        riskLevel: '高',
        description: '机械臂用于机械控制、轨迹规划、夹取搬运、自动化生产线模拟和机器人控制教学。',
        scenarios: ['机械控制实验', '轨迹规划教学', '自动化搬运演示'],
        checks: ['确认急停按钮可用', '检查夹具安装是否牢固', '确认运动范围内没有人员和杂物'],
        steps: ['打开控制终端', '确认机械臂处于初始安全位置', '加载基础演示程序', '低速运行测试动作'],
        warnings: ['机械臂运动范围内禁止站人', '不得绕过急停保护', '异常振动或碰撞时立即停止'],
        aiUrl: ''
      },
      {
        id: 'experiment-platform',
        name: '火箭发射架',
        category: '高校实验设备 / 发射架模型',
        riskLevel: '中',
        description: '实验教学平台用于课程实验、项目展示、传感器采集、机械系统综合实验和教学演示。',
        scenarios: ['课程实验教学', '传感器数据采集', '机械系统综合展示'],
        checks: ['检查电源和线缆连接', '确认模块安装牢固', '确认实验参数由教师审核'],
        steps: ['连接平台电源', '打开控制软件或面板', '选择实验模式', '按照实验指导书完成操作'],
        warnings: ['不得私自改接线路', '不得带电拆装模块', '异常发热或异味时立即断电并报告'],
        aiUrl: ''
      }
    ];

    const fallbackMessage = '暂未找到相关答案，请联系教师或实验员确认。涉及设备启动、控制参数修改、维修和异常处理时，请勿自行操作。';
    const fallbackFaq = [
      {
        deviceId: 'robot-dog',
        question: '启动前需要检查什么？',
        keywords: ['启动前', '检查', '准备', '电量', '环境'],
        answer: '请检查设备电量、外壳结构、关节状态、控制终端连接情况，并确认周围环境安全。'
      },
      {
        deviceId: 'robot-dog',
        question: '机器狗无法启动怎么办？',
        keywords: ['无法启动', '启动不了', '没反应', '开机'],
        answer: '请先检查电量、电源开关和控制终端连接状态。如仍无法启动，请联系教师或实验员处理。'
      },
      {
        deviceId: 'robot-arm',
        question: '机械臂发生碰撞怎么办？',
        keywords: ['碰撞', '撞到', '异常', '急停'],
        answer: '请立即按下急停按钮，停止设备运行，并联系教师或实验员检查机械臂状态。'
      },
      {
        deviceId: 'experiment-platform',
        question: '实验平台出现异味怎么办？',
        keywords: ['异味', '发热', '冒烟', '异常'],
        answer: '请立即断电并停止实验，不要继续操作，及时联系教师或实验员处理。'
      }
    ];

    let currentFaq = [];

    function getDeviceId() {
      return new URLSearchParams(window.location.search).get('id') || '';
    }

    function isTeacherPreview() {
      return new URLSearchParams(window.location.search).get('teacherPreview') === '1';
    }

    function getTeacherReturnUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get('teacherReturn') || 'qr.html';
    }

    function setupTeacherPreviewShell() {
      if (!isTeacherPreview()) return;
      const returnUrl = getTeacherReturnUrl();
      const safeReturnUrl = escapeHtml(returnUrl);
      const logoLink = document.querySelector('#headerLogoLink');
      const backLink = document.querySelector('#headerBackLink');
      const backText = document.querySelector('#headerBackText');
      const notice = document.querySelector('#teacherPreviewNotice');

      logoLink.href = returnUrl;
      logoLink.setAttribute('aria-label', '返回教师编辑页');
      backLink.href = returnUrl;
      backText.textContent = '返回教师编辑页';
      notice.className = 'mb-5 rounded-3xl border border-cyan-300/30 bg-cyan-300/10 p-4 shadow-[0_0_28px_rgba(34,211,238,0.12)] sm:p-5';
      notice.innerHTML = `
        <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
          <div>
            <p class="text-sm font-black text-cyan-100">教师预览模式</p>
            <p class="mt-1 text-sm leading-6 text-slate-300">这里只用于查看学生端展示效果。返回后继续新增或编辑设备，不进入学生使用流程。</p>
          </div>
          <div class="flex flex-col gap-2 sm:flex-row">
            <a href="${safeReturnUrl}" class="inline-flex min-h-11 items-center justify-center rounded-xl bg-cyan-300 px-4 py-2 text-sm font-black text-slate-950">返回继续编辑</a>
            <a href="qr.html" class="inline-flex min-h-11 items-center justify-center rounded-xl border border-slate-600 bg-slate-900 px-4 py-2 text-sm font-bold text-slate-100">回教师首页</a>
          </div>
        </div>
      `;
    }

    function shouldResetAdmissionForDemo() {
      const params = new URLSearchParams(window.location.search);
      return ['demo', 'reset', 'resetAccess'].some(key => params.get(key) === '1');
    }

    function clearDemoParamsFromUrl() {
      const url = new URL(window.location.href);
      ['demo', 'reset', 'resetAccess'].forEach(key => url.searchParams.delete(key));
      window.history.replaceState({}, '', url.toString());
    }

    async function loadDevices() {
      try {
        const response = await fetch('data/devices.json', { cache: 'no-store' });
        if (!response.ok) throw new Error('devices.json load failed');
        return prepareDevices(await response.json());
      } catch (error) {
        return prepareDevices(fallbackDevices);
      }
    }

    function readJsonStorage(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (error) {
        return fallback;
      }
    }

    function readCustomDevices() {
      return readJsonStorage('custom_devices', []);
    }

    function readDeletedDeviceIds() {
      return readJsonStorage('deleted_device_ids', []);
    }

    function readPreviewDevice() {
      const raw = new URLSearchParams(window.location.search).get('previewDevice');
      if (!raw) return null;
      try {
        const text = raw.trim().startsWith('{') ? raw : decodeURIComponent(raw);
        const device = JSON.parse(text);
        if (!device || typeof device !== 'object' || !device.id) return null;
        return device;
      } catch (error) {
        return null;
      }
    }

    function prepareDevices(baseDevices) {
      const deletedIds = new Set(readDeletedDeviceIds());
      const merged = [...baseDevices, ...readCustomDevices()];
      const previewDevice = readPreviewDevice();
      if (previewDevice) merged.push(previewDevice);
      const uniqueDevices = Array.from(new Map(merged.map(device => [device.id, device])).values());
      return applyDeviceOverrides(uniqueDevices).filter(device => !deletedIds.has(device.id));
    }

    function applyDeviceOverrides(devices) {
      return devices.map((device) => {
        try {
          const raw = localStorage.getItem(`device_override_${device.id}`);
          return raw ? { ...device, ...JSON.parse(raw), id: device.id } : device;
        } catch (error) {
          return device;
        }
      });
    }

    async function loadFaq() {
      try {
        const response = await fetch('data/faq.json', { cache: 'no-store' });
        if (!response.ok) throw new Error('faq.json load failed');
        return await response.json();
      } catch (error) {
        return fallbackFaq;
      }
    }

    function admissionKey(deviceId) {
      return `access_${deviceId}`;
    }

    function getAdmission(deviceId) {
      try {
        const raw = localStorage.getItem(admissionKey(deviceId));
        return raw ? JSON.parse(raw) : null;
      } catch (error) {
        return null;
      }
    }

    function saveAdmission(deviceId) {
      const admission = {
        completed: true,
        admittedAt: new Date().toISOString(),
        storageSaved: true
      };
      try {
        localStorage.setItem(admissionKey(deviceId), JSON.stringify(admission));
      } catch (error) {
        admission.storageSaved = false;
      }
      return admission;
    }

    function clearAdmission(deviceId) {
      try {
        localStorage.removeItem(admissionKey(deviceId));
      } catch (error) {
        // localStorage may be unavailable in some in-app browsers.
      }
    }

    function formatTime(isoString) {
      const date = new Date(isoString);
      if (Number.isNaN(date.getTime())) return '已记录';
      return date.toLocaleString('zh-CN', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function listItems(items, ordered = false) {
      const tag = ordered ? 'ol' : 'ul';
      const listClass = ordered ? 'list-decimal' : 'list-disc';
      return `<${tag} class="${listClass} space-y-2 pl-5 text-sm leading-6 text-slate-300">${items.map(item => `<li>${item}</li>`).join('')}</${tag}>`;
    }

    function infoCard(title, content, variant = 'default') {
      const colors = variant === 'warning'
        ? 'border-red-400/25 bg-red-500/10'
        : 'border-slate-700 bg-slate-900/80';
      return `
        <section class="min-w-0 rounded-2xl border ${colors} p-4 sm:p-5">
          <h2 class="mb-3 text-lg font-bold text-white">${title}</h2>
          ${content}
        </section>
      `;
    }

    function renderAdmissionCard(device, admission) {
      return `
        <section id="admissionCard" class="grid gap-4">
          <div class="relative overflow-hidden rounded-[1.7rem] border border-sky-100/45 bg-gradient-to-br from-sky-100 via-sky-400 to-blue-700 p-5 text-slate-950 shadow-[0_0_48px_rgba(56,189,248,0.34)] sm:p-7">
            <div class="absolute -left-16 -top-12 h-40 w-40 rounded-full bg-white/45 blur-2xl"></div>
            <div class="absolute right-0 top-0 h-full w-1/2 bg-gradient-to-br from-cyan-200/40 via-blue-500/20 to-blue-950/30"></div>
            <div class="absolute inset-x-0 bottom-0 h-24 bg-gradient-to-t from-blue-950/35 to-transparent"></div>
            <div class="absolute right-5 top-5 h-20 w-20 rotate-45 rounded-2xl border border-white/60 bg-gradient-to-br from-cyan-100/80 to-blue-500/80 shadow-[0_12px_30px_rgba(15,23,42,0.22)] sm:h-24 sm:w-24">
              <div class="absolute inset-3 rounded-xl border border-blue-700/20 bg-white/20"></div>
              <div class="absolute left-1/2 top-1/2 h-4 w-9 -translate-x-1/2 -translate-y-1/2 -rotate-45 border-b-[5px] border-r-[5px] border-cyan-900/70"></div>
            </div>

            <div class="relative max-w-[calc(100%-5.5rem)] sm:max-w-[calc(100%-7rem)]">
              <p class="inline-flex rounded-full border border-white/60 bg-white/35 px-3 py-1 text-xs font-black text-blue-900 shadow-sm">实验设备安全准入</p>
              <h2 class="mt-4 break-words text-3xl font-black leading-tight text-slate-950 sm:text-5xl">${device.name} 安全通行证</h2>
              <p class="mt-2 text-sm font-semibold text-blue-950/80">已完成安全确认，允许进入基础问答</p>
            </div>

            <div class="relative mt-8 grid gap-3 sm:grid-cols-2">
              <div class="rounded-2xl border border-white/35 bg-white/25 p-3 backdrop-blur">
                <p class="text-xs font-bold text-blue-950/70">设备类型</p>
                <p class="mt-1 break-words text-sm font-black text-slate-950">${device.category}</p>
              </div>
              <div class="rounded-2xl border border-emerald-100/60 bg-emerald-100/35 p-3 backdrop-blur">
                <p class="text-xs font-bold text-emerald-950/75">状态</p>
                <p class="mt-1 text-sm font-black text-emerald-950">已准入</p>
              </div>
            </div>

            <div class="relative mt-5">
              <div class="flex items-center justify-between gap-3 text-xs font-bold text-blue-950/75">
                <span>准入进度</span>
                <span>100%</span>
              </div>
              <div class="mt-2 h-3 overflow-hidden rounded-full bg-blue-950/20">
                <div class="h-full w-full rounded-full bg-gradient-to-r from-cyan-300 via-sky-500 to-blue-700"></div>
              </div>
              <p class="mt-3 break-words font-mono text-xs font-bold text-blue-950/80">准入时间：${formatTime(admission.admittedAt)}</p>
            </div>
          </div>

          <div class="rounded-2xl border border-cyan-300/20 bg-slate-900/80 p-4">
            <p class="text-xs font-semibold text-slate-400">数据说明</p>
            <p class="mt-1 text-xs leading-5 text-slate-300">${admission.storageSaved === false ? '当前浏览器未能写入本地缓存，但本次安全准入已完成。' : '仅保存在本机浏览器 localStorage，不上传个人信息。'}</p>
            <button id="resetAdmissionBtn" type="button" class="mt-4 inline-flex min-h-11 w-full items-center justify-center rounded-xl border border-cyan-300/35 bg-cyan-300/10 px-4 py-2 text-sm font-bold text-cyan-100 transition hover:border-cyan-200 sm:w-auto">重新演示安全准入</button>
          </div>
        </section>
      `;
    }

    function renderSafetyPanel() {
      const items = [
        '我已阅读本设备安全须知',
        '我已佩戴必要防护装备',
        '我确认将在教师或实验员指导下操作设备',
        '我已确认周围环境适合设备运行',
        '遇到异常情况，我会立即停止操作并联系教师或实验员'
      ];

      return `
        <section class="rounded-3xl border border-amber-300/25 bg-amber-300/10 p-5 sm:p-6">
          <p class="text-sm font-semibold text-amber-200">安全确认流程</p>
          <h2 class="mt-2 break-words text-2xl font-black text-white">完成确认后生成设备安全准入卡</h2>
          <p class="mt-3 text-sm leading-7 text-amber-50/90">请逐项确认。系统不会采集姓名、手机号、学号等个人信息。</p>
          <div class="mt-5 grid gap-3">
            ${items.map((item, index) => `
              <label class="flex min-h-12 items-start gap-3 rounded-2xl border border-amber-300/20 bg-slate-950/50 p-4 text-sm leading-6 text-slate-100">
                <input type="checkbox" class="safety-check mt-1 h-5 w-5 shrink-0 accent-cyan-300" data-index="${index}" />
                <span>${item}</span>
              </label>
            `).join('')}
          </div>

            </div>

        </section>

        <div class="mt-6 grid gap-4 lg:grid-cols-2">
          ${infoCard('使用场景', listItems(device.scenarios))}

    function setupAdmission(device) {
      const admissionArea = document.querySelector('#admissionArea');
      const startAskBtn = document.querySelector('#startAskBtn');
      const admission = getAdmission(device.id);

      if (admission?.completed) {
        admissionArea.innerHTML = renderAdmissionCard(device, admission);
        startAskBtn.textContent = '已完成安全准入';
        startAskBtn.addEventListener('click', () => {
          document.querySelector('#admissionCard')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
        setupResetAdmission(device);
        return;
      }

      startAskBtn.addEventListener('click', () => {
        admissionArea.innerHTML = renderSafetyPanel();
        admissionArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
        setupSafetyChecks(device);
      });
    }

    function setupSafetyChecks(device) {
      const checks = Array.from(document.querySelectorAll('.safety-check'));
      const button = document.querySelector('#confirmAdmissionBtn');

      function updateButton() {
        const ready = checks.every(item => item.checked);
        const tip = document.querySelector('#safetyTip');
        button.disabled = !ready;
        tip.textContent = ready ? '安全确认已完成，可以生成安全准入卡' : '请完成全部安全确认';
        tip.className = ready
          ? 'mt-4 text-sm font-semibold text-emerald-200'
          : 'mt-4 text-sm font-semibold text-amber-200';
        button.className = ready
          ? 'mt-3 inline-flex min-h-12 w-full items-center justify-center rounded-xl bg-cyan-300 px-5 py-3 text-sm font-bold text-slate-950 transition hover:bg-cyan-200 sm:w-auto'
          : 'mt-3 inline-flex min-h-12 w-full items-center justify-center rounded-xl bg-slate-700 px-5 py-3 text-sm font-bold text-slate-400 transition disabled:cursor-not-allowed sm:w-auto';
      }

      checks.forEach(item => item.addEventListener('change', updateButton));
      button.addEventListener('click', () => {
        if (!checks.every(item => item.checked)) return;
        const admission = saveAdmission(device.id);
        const admissionArea = document.querySelector('#admissionArea');
        admissionArea.innerHTML = renderAdmissionCard(device, admission);
        document.querySelector('#startAskBtn').textContent = '已完成安全准入';
        document.querySelector('#startAskBtn').addEventListener('click', () => {
          document.querySelector('#admissionCard')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
        document.querySelector('#admissionCard')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        setupResetAdmission(device);
      });
    }

    function setupResetAdmission(device) {
      const resetButton = document.querySelector('#resetAdmissionBtn');
      if (!resetButton) return;
      resetButton.addEventListener('click', () => {
        clearAdmission(device.id);
        const admissionArea = document.querySelector('#admissionArea');
        const startAskBtn = document.querySelector('#startAskBtn');
        startAskBtn.textContent = '开始安全准入';
        admissionArea.innerHTML = renderSafetyPanel();
        admissionArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
        setupSafetyChecks(device);
      });
    }

    function findAnswer(device, question) {
      const normalized = question.trim().toLowerCase();
      if (!normalized) return '请先输入设备相关问题。';

      const faqs = currentFaq.filter(item => item.deviceId === device.id);
      const matched = faqs.find(item => {
        const q = `${item.question} ${item.keywords.join(' ')}`.toLowerCase();
        return item.keywords.some(keyword => normalized.includes(keyword.toLowerCase())) || q.includes(normalized);
      });

      return matched ? matched.answer : fallbackMessage;
    }

    function setupDraggableAssistant(button, storageKey, onTap) {
      let pointerId = null;
      let startX = 0;
      let startY = 0;
      let originX = 0;
      let originY = 0;
      let dragged = false;

      function clampPosition(x, y, rect) {
        const margin = 8;
        return {
          x: Math.min(Math.max(margin, x), window.innerWidth - rect.width - margin),
          y: Math.min(Math.max(margin, y), window.innerHeight - rect.height - margin)
        };
      }

      function applyPosition(x, y) {
        const rect = button.getBoundingClientRect();
        const next = clampPosition(x, y, rect);
        button.style.left = `${next.x}px`;
        button.style.top = `${next.y}px`;
        button.style.right = 'auto';
        button.style.bottom = 'auto';
        return next;
      }

      try {
        const saved = JSON.parse(localStorage.getItem(storageKey) || 'null');
        if (saved && Number.isFinite(saved.x) && Number.isFinite(saved.y)) {
          window.requestAnimationFrame(() => applyPosition(saved.x, saved.y));
        }
      } catch (error) {}

      button.addEventListener('pointerdown', (event) => {
        if (event.button && event.button !== 0) return;
        pointerId = event.pointerId;
        dragged = false;
        startX = event.clientX;
        startY = event.clientY;
        const rect = button.getBoundingClientRect();
        originX = rect.left;
        originY = rect.top;
        button.setPointerCapture(pointerId);
        button.classList.add('is-dragging');
      });

      button.addEventListener('pointermove', (event) => {
        if (event.pointerId !== pointerId) return;
        const dx = event.clientX - startX;
        const dy = event.clientY - startY;
        if (Math.abs(dx) > 5 || Math.abs(dy) > 5) dragged = true;
        if (!dragged) return;
        event.preventDefault();
        applyPosition(originX + dx, originY + dy);
      });

      button.addEventListener('pointerup', (event) => {
        if (event.pointerId !== pointerId) return;
        button.releasePointerCapture(pointerId);
        button.classList.remove('is-dragging');
        pointerId = null;
        if (dragged) {
          const rect = button.getBoundingClientRect();
          try {
            localStorage.setItem(storageKey, JSON.stringify({ x: Math.round(rect.left), y: Math.round(rect.top) }));
          } catch (error) {}
          return;
        }
        onTap();
      });

      button.addEventListener('pointercancel', () => {
        pointerId = null;
        button.classList.remove('is-dragging');
      });

      button.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          onTap();
        }
      });
    }

    function setupQa(device) {
      const input = document.querySelector('#questionInput');
      const askBtn = document.querySelector('#askBtn');
      const chatBox = document.querySelector('#chatBox');
      const suggestions = Array.from(document.querySelectorAll('.faq-suggestion'));
      const modal = document.querySelector('#qaModal');
      const openButton = document.querySelector('#assistantFloatBtn');
      const closeButton = document.querySelector('#closeQaModalBtn');
      const backdrop = document.querySelector('#qaBackdrop');

      function openModal() {
        modal.classList.remove('hidden');
        document.body.classList.add('overflow-hidden');
        setTimeout(() => input?.focus(), 60);
      }

      function closeModal() {
        modal.classList.add('hidden');
        document.body.classList.remove('overflow-hidden');
      }

      function ask(question) {
        input.value = question;
        const answer = findAnswer(device, question);
        chatBox.insertAdjacentHTML('beforeend', `
          <div class="ml-auto max-w-[92%] rounded-2xl rounded-br-sm bg-blue-500 px-4 py-3 text-white">
            <p class="break-words">${escapeHtml(question || '未输入')}</p>
          </div>
          <div class="mr-auto max-w-[92%] rounded-2xl rounded-bl-sm border border-cyan-300/20 bg-cyan-300/10 px-4 py-3 text-cyan-50">
            <p class="break-words">${escapeHtml(answer)}</p>
          </div>
        `);
        chatBox.scrollTop = chatBox.scrollHeight;
        input.value = '';
      }

      setupDraggableAssistant(openButton, `assistant_device_position_${device.id}`, openModal);
      closeButton.addEventListener('click', closeModal);
      backdrop.addEventListener('click', closeModal);
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && !modal.classList.contains('hidden')) closeModal();
      });
      askBtn.addEventListener('click', () => ask(input.value));
      input.addEventListener('keydown', event => {
        if (event.key === 'Enter') ask(input.value);
      });
      suggestions.forEach(button => {
        button.addEventListener('click', () => ask(button.dataset.question));
      });
    }

    function renderNotFound(deviceId) {
      document.querySelector('#deviceRoot').innerHTML = `
        <section class="rounded-3xl border border-red-400/25 bg-red-500/10 p-6">
          <p class="text-sm font-semibold text-red-200">未找到设备</p>
          <h1 class="mt-3 text-2xl font-black text-white">未找到设备信息</h1>
          <p class="mt-3 break-words text-sm leading-6 text-slate-300">当前链接中的设备 ID 为：<span class="font-mono text-cyan-100">${deviceId || '空'}</span>。请检查设备链接或返回首页重新选择设备。</p>
          <a href="index.html" class="mt-5 inline-flex min-h-11 w-full items-center justify-center rounded-xl bg-cyan-300 px-4 py-2 text-sm font-bold text-slate-950 sm:w-auto">返回首页</a>
        </section>
      `;
    }

    async function init() {
      setupTeacherPreviewShell();
      const deviceId = getDeviceId();
      if (deviceId && shouldResetAdmissionForDemo()) {
        clearAdmission(deviceId);
        clearDemoParamsFromUrl();
      }
      const [devices, faq] = await Promise.all([loadDevices(), loadFaq()]);
      currentFaq = faq;
      const device = devices.find(item => item.id === deviceId);
      if (!device) {
        renderNotFound(deviceId);
        return;
      }
      document.title = `${device.name} - 贝尔智机通`;
      renderDevice(device);
    }

    init();
  </script>
