<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="贝尔智机通教师设备信息编辑页。" />
  <title>设备信息编辑 - 贝尔智机通</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            tech: {
              blue: '#38bdf8',
              cyan: '#22d3ee',
              orange: '#f59e0b',
              red: '#ef4444'
            }
          },
          boxShadow: {
            glow: '0 0 36px rgba(56, 189, 248, 0.18)'
          }
        }
      }
    };
  </script>
</head>
<body class="min-h-screen overflow-x-hidden bg-slate-950 text-slate-100 antialiased">
  <main class="relative min-h-screen overflow-hidden">
    <div class="absolute inset-0 pointer-events-none">
      <div class="absolute left-1/2 top-0 h-72 w-72 -translate-x-1/2 rounded-full bg-cyan-500/10 blur-3xl"></div>
      <div class="absolute right-0 top-48 h-72 w-72 rounded-full bg-blue-500/10 blur-3xl"></div>
      <div class="absolute inset-0 bg-[linear-gradient(rgba(56,189,248,0.055)_1px,transparent_1px),linear-gradient(90deg,rgba(56,189,248,0.055)_1px,transparent_1px)] bg-[size:28px_28px]"></div>
    </div>

    <section class="relative mx-auto w-full max-w-6xl px-4 py-6 sm:px-8 lg:px-10">
      <header class="flex flex-wrap items-center justify-between gap-3">
        <a href="qr.html" class="inline-flex min-h-10 items-center gap-2 text-sm font-semibold text-cyan-100 hover:text-white">
          <span>←</span>
          返回教师首页
        </a>
        <span class="rounded-full border border-cyan-300/30 bg-cyan-300/10 px-3 py-1 text-xs font-semibold text-cyan-100">设备信息编辑</span>
      </header>

      <section class="mt-8 rounded-3xl border border-cyan-300/20 bg-slate-900/80 p-5 shadow-glow sm:p-6">
        <p class="text-sm font-semibold text-cyan-200">教师编辑页</p>
        <h1 id="pageTitle" class="mt-2 break-words text-3xl font-black leading-tight text-white sm:text-5xl">设备信息编辑</h1>
        <p class="mt-4 max-w-3xl text-sm leading-7 text-slate-400">可编辑学生端展示的设备简介、操作步骤、安全须知等内容。无后台和数据库，跨电脑演示请以线上 GitHub Pages 为准：编辑后导出 devices.json，并上传替换 GitHub 仓库 data/devices.json。</p>
      </section>

      <section id="editorRoot" class="mt-6" aria-live="polite"></section>
    </section>
  </main>

  <script>
    const fallbackDevices = [
      {
        id: 'robot-dog',
        name: '机械狗',
        category: '智能硬件 / 机器人设备',
        riskLevel: '中',
        description: '机器狗是一类四足机器人设备，可用于高校机械、自动化、机器人相关课程中的运动控制、路径规划、传感器识别和智能交互教学。',
        scenarios: ['机器人运动控制实验', '智能硬件展示', '机械结构与控制系统教学', '人机交互实验'],
        checks: ['检查设备电量是否充足', '检查设备外壳和关节结构是否完好', '确认周围地面平整、无障碍物', '检查遥控器或控制终端连接状态'],
        steps: ['将机器狗放置在平整地面', '打开设备电源', '等待设备完成初始化', '连接遥控器或控制终端', '选择基础运动模式'],
        warnings: ['设备运行时不要站在机器狗正前方或关节运动区域内', '不要强行拖拽机器狗腿部结构', '出现异常抖动、失控或摔倒时，应立即停止运行'],
        aiUrl: ''
      },
      {
        id: 'robot-arm',
        name: '实验设备',
        category: '自动化实验设备',
        riskLevel: '高',
        description: '机械臂用于机械控制、轨迹规划、夹取搬运、自动化生产线模拟和机器人控制教学。',
        scenarios: ['机械控制实验', '轨迹规划教学', '自动化搬运演示'],
        checks: ['确认急停按钮可用', '检查夹具安装是否牢固', '确认运动范围内没有人员和杂物'],
        steps: ['打开控制终端', '确认机械臂处于初始安全位置', '加载基础演示程序', '低速运行测试动作'],
        warnings: ['机械臂运动范围内禁止站人', '不得绕过急停保护', '异常振动或碰撞时立即停止'],
        aiUrl: ''
      },
      {
        id: 'experiment-platform',
        name: '火箭发射架',
        category: '高校实验设备 / 发射架模型',
        riskLevel: '中',
        description: '实验教学平台用于课程实验、项目展示、传感器采集、机械系统综合实验和教学演示。',
        scenarios: ['课程实验教学', '传感器数据采集', '机械系统综合展示'],
        checks: ['检查电源和线缆连接', '确认模块安装牢固', '确认实验参数由教师审核'],
        steps: ['连接平台电源', '打开控制软件或面板', '选择实验模式', '按照实验指导书完成操作'],
        warnings: ['不得私自改接线路', '不得带电拆装模块', '异常发热或异味时立即断电并报告'],
        aiUrl: ''
      }
    ];
    let loadedDevices = [];
    const previewDraftKey = 'teacher_preview_device_draft';

    function getDeviceId() {
      return new URLSearchParams(window.location.search).get('id') || '';
    }

    function isNewMode() {
      return new URLSearchParams(window.location.search).get('mode') === 'new';
    }

    function isFromPreview() {
      return new URLSearchParams(window.location.search).get('fromPreview') === '1';
    }

    async function loadDevices() {
      try {
        const response = await fetch('data/devices.json', { cache: 'no-store' });
        if (!response.ok) throw new Error('devices.json load failed');
        return prepareDevices(await response.json());
      } catch (error) {
        return prepareDevices(fallbackDevices);
      }
    }

    function overrideKey(deviceId) {
      return `device_override_${deviceId}`;
    }

    function readJsonStorage(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (error) {
        return fallback;
      }
    }

    function writeJsonStorage(key, value) {
      localStorage.setItem(key, JSON.stringify(value));
    }

    function readCustomDevices() {
      return readJsonStorage('custom_devices', []);
    }

    function readDeletedDeviceIds() {
      return readJsonStorage('deleted_device_ids', []);
    }

    function prepareDevices(baseDevices) {
      const deletedIds = new Set(readDeletedDeviceIds());
      const merged = [...baseDevices, ...readCustomDevices()];
      const uniqueDevices = Array.from(new Map(merged.map(device => [device.id, device])).values());
      return applyDeviceOverrides(uniqueDevices).filter(device => !deletedIds.has(device.id));
    }

    function applyDeviceOverrides(devices) {
      return devices.map((device) => {
        try {
          const raw = localStorage.getItem(overrideKey(device.id));
          return raw ? { ...device, ...JSON.parse(raw), id: device.id } : device;
        } catch (error) {
          return device;
        }
      });
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function joinLines(items) {
      return Array.isArray(items) ? items.join('\n') : '';
    }

    function splitLines(value) {
      return String(value || '')
        .split('\n')
        .map(item => item.trim())
        .filter(Boolean);
    }

    function field(label, id, value, type = 'text') {
      return `
        <label class="block">
          <span class="text-sm font-semibold text-cyan-100">${label}</span>
          <input id="${id}" type="${type}" value="${escapeHtml(value)}" class="mt-2 min-h-12 w-full rounded-xl border border-slate-700 bg-slate-950 px-4 text-sm text-white outline-none transition placeholder:text-slate-500 focus:border-cyan-300" />
        </label>
      `;
    }

    function idField(device, readonly = false) {
      return `
        <label class="block">
          <span class="text-sm font-semibold text-cyan-100">设备 ID</span>
          <input id="deviceIdInput" type="text" value="${escapeHtml(device.id)}" ${readonly ? 'readonly' : ''} class="mt-2 min-h-12 w-full rounded-xl border border-slate-700 bg-slate-950 px-4 text-sm text-white outline-none transition placeholder:text-slate-500 focus:border-cyan-300 ${readonly ? 'opacity-70' : ''}" placeholder="例如：cnc-platform" />
          <span class="mt-1 block text-xs leading-5 text-slate-500">建议使用英文小写、数字和短横线，保存后会生成 device.html?id=设备ID。</span>
        </label>
      `;
    }

    function textareaField(label, id, value, rows = 5) {
      return `
        <label class="block">
          <span class="text-sm font-semibold text-cyan-100">${label}</span>
          <textarea id="${id}" rows="${rows}" class="mt-2 w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-sm leading-6 text-white outline-none transition placeholder:text-slate-500 focus:border-cyan-300">${escapeHtml(value)}</textarea>
        </label>
      `;
    }

    function collectDevice() {
      const rawId = isNewMode()
        ? document.querySelector('#deviceIdInput').value.trim()
        : getDeviceId();
      return {
        id: rawId,
        name: document.querySelector('#name').value.trim(),
        category: document.querySelector('#category').value.trim(),
        riskLevel: loadedDevices.find(item => item.id === rawId)?.riskLevel || '中',
        description: document.querySelector('#description').value.trim(),
        scenarios: splitLines(document.querySelector('#scenarios').value),
        checks: splitLines(document.querySelector('#checks').value),
        steps: splitLines(document.querySelector('#steps').value),
        warnings: splitLines(document.querySelector('#warnings').value),
        aiUrl: document.querySelector('#aiUrl').value.trim()
      };
    }

    function fillForm(device) {
      const idInput = document.querySelector('#deviceIdInput');
      if (idInput && !idInput.readOnly) idInput.value = device.id || '';
      document.querySelector('#name').value = device.name || '';
      document.querySelector('#category').value = device.category || '';
      document.querySelector('#description').value = device.description || '';
      document.querySelector('#scenarios').value = joinLines(device.scenarios);
      document.querySelector('#checks').value = joinLines(device.checks);
      document.querySelector('#steps').value = joinLines(device.steps);
      document.querySelector('#warnings').value = joinLines(device.warnings);
      document.querySelector('#aiUrl').value = device.aiUrl || '';
    }

    function showMessage(text, type = 'info') {
      const message = document.querySelector('#message');
      const color = type === 'error' ? 'text-red-100 border-red-300/25 bg-red-500/10' : 'text-emerald-100 border-emerald-300/25 bg-emerald-300/10';
      message.className = `mt-4 rounded-2xl border p-3 text-sm leading-6 ${color}`;
      message.textContent = text;
      message.classList.remove('hidden');
    }

    function readPreviewDraft() {
      const urlDraft = new URLSearchParams(window.location.search).get('draft');
      if (urlDraft) {
        try {
          const text = urlDraft.trim().startsWith('{') ? urlDraft : decodeURIComponent(urlDraft);
          const draft = JSON.parse(text);
          return draft && typeof draft === 'object' ? draft : null;
        } catch (error) {
          return null;
        }
      }
      if (!isFromPreview()) return null;
      try {
        const raw = sessionStorage.getItem(previewDraftKey);
        return raw ? JSON.parse(raw) : null;
      } catch (error) {
        return null;
      }
    }

    function previewDeviceUrl(device) {
      const encoded = encodeURIComponent(JSON.stringify(device));
      const returnUrl = isNewMode()
        ? `teacher-device.html?mode=new&fromPreview=1&draft=${encoded}`
        : `teacher-device.html?id=${encodeURIComponent(device.id)}&fromPreview=1&draft=${encoded}`;
      return `device.html?id=${encodeURIComponent(device.id)}&previewDevice=${encoded}&teacherPreview=1&teacherReturn=${encodeURIComponent(returnUrl)}`;
    }

    function openPreviewDevice() {
      const device = collectDevice();
      if (!validateDevice(device, isNewMode())) return;
      try {
        sessionStorage.setItem(previewDraftKey, JSON.stringify(device));
      } catch (error) {
        // If sessionStorage is blocked, URL preview still works with previewDevice.
      }
      window.location.href = previewDeviceUrl(device);
    }

    function renderEditor(device, mode = 'edit') {
      const creating = mode === 'new';
      document.querySelector('#pageTitle').textContent = creating ? '新增设备' : `${device.name} 信息编辑`;
      document.querySelector('#editorRoot').innerHTML = `
        <div class="grid gap-5 lg:grid-cols-[1.1fr_0.9fr]">
          <section class="rounded-3xl border border-slate-700 bg-slate-900/80 p-5 sm:p-6">
            <div class="grid gap-4 sm:grid-cols-2">
              ${idField(device, !creating)}
              ${field('设备名称', 'name', device.name)}
              ${field('设备类型', 'category', device.category)}
              ${field('AI 设备助手链接', 'aiUrl', device.aiUrl || '', 'url')}
            </div>
            <div class="mt-4 grid gap-4">
              ${textareaField('设备简介', 'description', device.description, 4)}
              ${textareaField('使用场景（一行一条）', 'scenarios', joinLines(device.scenarios))}
              ${textareaField('操作前检查（一行一条）', 'checks', joinLines(device.checks))}
              ${textareaField('基础操作步骤（一行一条）', 'steps', joinLines(device.steps), 6)}
              ${textareaField('安全注意事项（一行一条）', 'warnings', joinLines(device.warnings), 6)}
            </div>
            <div class="mt-5 flex flex-col gap-3 sm:flex-row sm:flex-wrap">
              <button id="saveBackBtn" type="button" class="inline-flex min-h-12 w-full items-center justify-center rounded-xl bg-cyan-300 px-5 py-3 text-sm font-black text-slate-950 transition hover:bg-cyan-200 sm:w-auto">保存并返回教师首页</button>
              <button id="saveBtn" type="button" class="inline-flex min-h-12 w-full items-center justify-center rounded-xl border border-cyan-300/30 bg-cyan-300/10 px-5 py-3 text-sm font-bold text-cyan-100 transition hover:bg-cyan-300/15 sm:w-auto">保存本机预览</button>
              <button id="previewBtn" type="button" class="inline-flex min-h-12 w-full items-center justify-center rounded-xl border border-blue-300/30 bg-blue-400/10 px-5 py-3 text-sm font-bold text-blue-100 transition hover:border-blue-200 sm:w-auto">预览学生页</button>
              <button id="exportBtn" type="button" class="inline-flex min-h-12 w-full items-center justify-center rounded-xl border border-emerald-300/30 bg-emerald-300/10 px-5 py-3 text-sm font-bold text-emerald-100 transition hover:bg-emerald-300/15 sm:w-auto">导出 devices.json</button>
              ${creating ? '' : `<button id="resetBtn" type="button" class="inline-flex min-h-12 w-full items-center justify-center rounded-xl border border-red-300/30 bg-red-500/10 px-5 py-3 text-sm font-bold text-red-100 transition hover:bg-red-500/15 sm:w-auto">清除本机修改</button>`}
            </div>
            <div id="message" class="hidden"></div>
          </section>

          <aside class="rounded-3xl border border-amber-300/25 bg-amber-300/10 p-5 sm:p-6">
            <p class="text-sm font-semibold text-amber-100">重新上传文档更新</p>
            <h2 class="mt-2 text-2xl font-black text-white">上传说明书或 AI 整理后的 JSON</h2>
            <p class="mt-3 text-sm leading-7 text-amber-50/90">当前静态版不解析 PDF。建议先把 PDF 给 ChatGPT / 豆包 / Kimi 整理成 JSON，再上传 JSON 自动填入表单；TXT / MD 会显示为参考文本。</p>
            <label class="mt-5 flex min-h-28 cursor-pointer flex-col items-center justify-center rounded-2xl border border-dashed border-amber-300/35 bg-slate-950/45 px-4 py-5 text-center text-sm text-amber-50 transition hover:bg-slate-950/65">
              <span class="font-bold">选择本地文档</span>
              <span class="mt-1 text-xs text-amber-50/70">支持 .json / .txt / .md</span>
              <input id="docFile" type="file" accept=".json,.txt,.md" class="sr-only" />
            </label>
            <textarea id="docPreview" rows="12" placeholder="上传 TXT / MD 后会显示在这里，便于人工参考；上传 JSON 会尝试自动填入左侧表单。" class="mt-4 w-full rounded-xl border border-amber-300/20 bg-slate-950/70 px-4 py-3 text-xs leading-6 text-amber-50 outline-none placeholder:text-amber-50/40"></textarea>
            <div class="mt-4 rounded-2xl border border-slate-700 bg-slate-950/60 p-4 text-xs leading-6 text-slate-400">
              完成编辑后点击“保存并返回教师首页”。如需真实上线，请导出 devices.json，并把确认后的内容同步写回 GitHub 仓库里的 data/devices.json。
            </div>
          </aside>
        </div>
      `;
      setupEditorActions(device, creating);
    }

    function validateDevice(device, creating) {
      if (!device.id || !/^[a-z0-9-]+$/.test(device.id)) {
        showMessage('设备 ID 必须填写，且只能使用英文小写、数字和短横线，例如 robot-dog。', 'error');
        return false;
      }
      if (!device.name || !device.category || !device.description) {
        showMessage('请至少填写设备名称、设备类型和设备简介。', 'error');
        return false;
      }
      if (!device.scenarios.length || !device.checks.length || !device.steps.length || !device.warnings.length) {
        showMessage('请至少填写使用场景、操作前检查、基础操作步骤和安全注意事项。', 'error');
        return false;
      }
      const customIds = new Set(readCustomDevices().map(item => item.id));
      if (creating && loadedDevices.some(item => item.id === device.id) && !customIds.has(device.id)) {
        showMessage('设备 ID 已存在，请换一个唯一 ID。', 'error');
        return false;
      }
      return true;
    }

    function saveCustomDevice(device) {
      const customDevices = readCustomDevices();
      const nextDevices = customDevices.some(item => item.id === device.id)
        ? customDevices.map(item => item.id === device.id ? device : item)
        : [...customDevices, device];
      writeJsonStorage('custom_devices', nextDevices);
      const deletedIds = readDeletedDeviceIds().filter(id => id !== device.id);
      writeJsonStorage('deleted_device_ids', deletedIds);
    }

    function saveCurrentDevice(creating = false) {
      const device = collectDevice();
      if (!validateDevice(device, creating)) return null;

      const customDevices = readCustomDevices();
      const isCustom = customDevices.some(item => item.id === device.id);
      try {
        if (creating || isCustom) {
          saveCustomDevice(device);
        } else {
          localStorage.setItem(overrideKey(device.id), JSON.stringify(device));
        }
        loadedDevices = prepareDevices(loadedDevices);
        showMessage(creating ? '已新增设备到本机预览。若要在别人电脑同步，请导出 devices.json 并上传到 GitHub。' : '已保存到本机浏览器。若要在别人电脑同步，请导出 devices.json 并上传到 GitHub。');
        return device;
      } catch (error) {
        const exists = loadedDevices.some(item => item.id === device.id);
        const nextDevices = exists
          ? loadedDevices.map(item => item.id === device.id ? device : item)
          : [...loadedDevices, device];
        downloadText('devices.json', `${JSON.stringify(nextDevices, null, 2)}\n`);
        showMessage('当前 file:// 本地文件模式不能写入本机缓存，已自动导出 devices.json。你仍可点击“预览学生页”查看当前表单效果；别人电脑演示请上传替换 GitHub 仓库 data/devices.json。', 'error');
        return null;
      }
    }

    function downloadText(filename, text) {
      const blob = new Blob([text], { type: 'application/json;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    function exportDevicesJson() {
      const current = collectDevice();
      const exists = loadedDevices.some(device => device.id === current.id);
      const nextDevices = exists
        ? loadedDevices.map((device) => device.id === current.id ? current : device)
        : [...loadedDevices, current];
      downloadText('devices.json', `${JSON.stringify(nextDevices, null, 2)}\n`);
      showMessage('已导出 devices.json。上线维护时，把它替换到 GitHub 仓库的 data/devices.json。');
    }

    function setupEditorActions(originalDevice, creating) {
      document.querySelector('#saveBtn').addEventListener('click', () => saveCurrentDevice(creating));
      document.querySelector('#previewBtn').addEventListener('click', openPreviewDevice);
      document.querySelector('#exportBtn').addEventListener('click', exportDevicesJson);
      document.querySelector('#saveBackBtn').addEventListener('click', () => {
        if (saveCurrentDevice(creating)) window.location.href = 'qr.html';
      });
      const resetButton = document.querySelector('#resetBtn');
      if (resetButton) {
        resetButton.addEventListener('click', () => {
          const customDevices = readCustomDevices();
          if (customDevices.some(item => item.id === originalDevice.id)) {
            writeJsonStorage('custom_devices', customDevices.filter(item => item.id !== originalDevice.id));
            showMessage('已清除本机新增设备，页面将返回教师首页。');
            window.setTimeout(() => window.location.href = 'qr.html', 500);
            return;
          }
          localStorage.removeItem(overrideKey(originalDevice.id));
          showMessage('已清除本机修改，页面将恢复为 data/devices.json 中的内容。');
          window.setTimeout(() => window.location.reload(), 500);
        });
      }
      document.querySelector('#docFile').addEventListener('change', async (event) => {
        const file = event.target.files[0];
        if (!file) return;
        const text = await file.text();
        document.querySelector('#docPreview').value = text;
        if (file.name.toLowerCase().endsWith('.json')) {
          try {
            const parsed = JSON.parse(text);
            const device = Array.isArray(parsed)
              ? (creating ? parsed[0] : parsed.find(item => item.id === originalDevice.id))
              : parsed;
            if (!device || typeof device !== 'object') throw new Error('invalid device json');
            fillForm({ ...originalDevice, ...device, id: creating ? (device.id || '') : originalDevice.id });
            showMessage('已从 JSON 自动填入表单，请人工审核安全内容后保存。');
          } catch (error) {
            showMessage('JSON 无法识别，请检查格式，或把内容作为参考手动填写。', 'error');
          }
        } else {
          showMessage('文档已载入参考区。请人工整理后填写左侧表单。');
        }
      });
    }

    function renderNotFound(deviceId) {
      document.querySelector('#editorRoot').innerHTML = `
        <section class="rounded-3xl border border-red-400/25 bg-red-500/10 p-6">
          <p class="text-sm font-semibold text-red-200">未找到设备</p>
          <h1 class="mt-3 text-2xl font-black text-white">未找到设备信息</h1>
          <p class="mt-3 break-words text-sm leading-6 text-slate-300">当前链接中的设备 ID 为：<span class="font-mono text-cyan-100">${escapeHtml(deviceId || '空')}</span>。请返回教师首页重新选择设备。</p>
          <a href="qr.html" class="mt-5 inline-flex min-h-11 w-full items-center justify-center rounded-xl bg-cyan-300 px-4 py-2 text-sm font-bold text-slate-950 sm:w-auto">返回教师首页</a>
        </section>
      `;
    }

    async function init() {
      const devices = await loadDevices();
      loadedDevices = devices;
      if (isNewMode()) {
        const draftDevice = readPreviewDraft();
        const newDevice = draftDevice || {
          id: '',
          name: '',
          category: '',
          riskLevel: '中',
          description: '',
          scenarios: [],
          checks: [],
          steps: [],
          warnings: [],
          aiUrl: ''
        };
        document.title = '新增设备 - 贝尔智机通';
        renderEditor(newDevice, 'new');
        return;
      }

      const deviceId = getDeviceId();
      const device = devices.find(item => item.id === deviceId);
      if (!device) {
        renderNotFound(deviceId);
        return;
      }
      const draftDevice = readPreviewDraft();
      const deviceForEdit = draftDevice && draftDevice.id === device.id ? { ...device, ...draftDevice } : device;
      document.title = `${deviceForEdit.name} 信息编辑 - 贝尔智机通`;
      renderEditor(deviceForEdit);
    }

    init();
  </script>
</body>
</html>
